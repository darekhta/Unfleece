[package]
name = "unfleece-core"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust PDF object-graph operations for Unfleece, compiled to WebAssembly."
license = "MIT OR Apache-2.0"
repository = "https://github.com/darekhta/Unfleece"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
lopdf = { version = "0.35", default-features = false, features = ["nom_parser"] }
# wasm-safe (pure Rust) building blocks for the owned engine modules
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# wave 2: ZIP containers (office/EPUB) + Standard Security encryption
zip = { version = "2", default-features = false, features = ["deflate"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sha2 = "0.10"
md-5 = "0.10"
rc4 = "0.2"
getrandom = { version = "0.2", features = ["js"] }

# wasm-bindgen is only needed when compiling to wasm; native `cargo test` skips it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true

[dev-dependencies]
proptest = "1"
